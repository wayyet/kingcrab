<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1180" viewBox="0 0 1180 1180" font-family="'Microsoft YaHei','微软雅黑',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowHttp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8A4FBF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="1180" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="40" y="42" font-size="24" font-weight="bold" fill="#1a1a1a">hirebot 与 kingcrab 调用堆栈层次图</text>
  <text x="40" y="68" font-size="13.5" fill="#555">上下游协作:hirebot 招聘业务 →(HTTP)→ kingcrab AI 运行时　|　红框 = 基础设施冗余(A)　橙框 = 业务疑似冗余(B)</text>

  <!-- 客户端层 -->
  <rect x="90" y="90" width="560" height="48" rx="8" fill="#EEEEEE" stroke="#888" stroke-width="1.5"/>
  <text x="370" y="119" font-size="13.5" text-anchor="middle" fill="#222">客户端层:前端(Vite / TS 浏览器)· OpenClaw.Cli · Companion · Dashboard</text>

  <!-- hirebot 分组框 -->
  <rect x="40" y="158" width="670" height="350" rx="10" fill="#F5F9FF" stroke="#2F6FBF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="54" y="180" font-size="14" font-weight="bold" fill="#2F6FBF">hirebot 进程(招聘业务)　编排:HireBot.AppHost(.NET Aspire 声明式编排)</text>

  <!-- ApiService -->
  <rect x="90" y="196" width="560" height="98" rx="8" fill="#E8F1FC" stroke="#2F6FBF" stroke-width="1.5"/>
  <text x="370" y="218" font-size="14" font-weight="bold" text-anchor="middle" fill="#123">HireBot.ApiService(API 层)</text>
  <text x="370" y="239" font-size="12" text-anchor="middle" fill="#333">Controllers:Employees / EmployeeTemplates / Hirings / HiringMaterials / Instances / Settings</text>
  <text x="370" y="259" font-size="12" text-anchor="middle" fill="#333">Authentication〔B·认证〕　McpTools〔B·工具/MCP〕　Services / MaterialTextExtractor</text>
  <text x="370" y="281" font-size="12" text-anchor="middle" fill="#B5651D">会话触发 ConversationKickoffPrompt〔B·AI 会话〕　招聘领域〔B·数字员工〕</text>

  <!-- 领域/仓储 -->
  <rect x="90" y="308" width="560" height="44" rx="8" fill="#E8F1FC" stroke="#2F6FBF" stroke-width="1.5"/>
  <text x="370" y="335" font-size="13" text-anchor="middle" fill="#123">HireBot.Core · HireBot.Repository · HireBot.Abstraction(领域 / 仓储 / 迁移)</text>

  <!-- PostgreSQL -->
  <rect x="90" y="364" width="560" height="40" rx="8" fill="#DCE8F5" stroke="#2F6FBF" stroke-width="1.5"/>
  <text x="370" y="389" font-size="13" text-anchor="middle" fill="#123">PostgreSQL(hirebot 库)</text>

  <!-- HireBot.ServiceDefaults 冗余A -->
  <rect x="90" y="430" width="560" height="56" rx="8" fill="#FDECEC" stroke="#D64545" stroke-width="2.5"/>
  <text x="370" y="453" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#B02A2A">HireBot.ServiceDefaults　〔冗余 A〕</text>
  <text x="370" y="474" font-size="12" text-anchor="middle" fill="#555">OpenTelemetry · 健康检查 · 服务发现 · HTTP 弹性(与 kingcrab 雷同)</text>

  <!-- HTTP 边界 -->
  <rect x="90" y="536" width="560" height="50" rx="8" fill="#F3E8FC" stroke="#8A4FBF" stroke-width="2"/>
  <text x="370" y="558" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#6A2F9F">──　进程 / HTTP 调用边界　──</text>
  <text x="370" y="577" font-size="11.5" text-anchor="middle" fill="#555">POST /admin/digital-employee/upload　·　会话请求转发　(KingCrew:HttpTimeoutSeconds)</text>

  <!-- kingcrab 分组框 -->
  <rect x="40" y="606" width="670" height="452" rx="10" fill="#F3FBF6" stroke="#2E9E5B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="54" y="628" font-size="14" font-weight="bold" fill="#2E9E5B">kingcrab / OpenClaw.NET 进程(AI 运行时)　编排:Kingcrab.AppHost(.NET Aspire)+ Keycloak</text>

  <!-- Gateway -->
  <rect x="90" y="644" width="560" height="60" rx="8" fill="#E8F6EE" stroke="#E8862E" stroke-width="2"/>
  <text x="370" y="668" font-size="14" font-weight="bold" text-anchor="middle" fill="#123">OpenClaw.Gateway(HTTP / WebSocket / Webhook)</text>
  <text x="370" y="690" font-size="12" text-anchor="middle" fill="#B5651D">Auth / Policy / Approvals〔B·认证〕　+ Keycloak 认证服务</text>

  <!-- Agent -->
  <rect x="90" y="720" width="560" height="58" rx="8" fill="#E8F6EE" stroke="#2E9E5B" stroke-width="1.5"/>
  <text x="370" y="743" font-size="14" font-weight="bold" text-anchor="middle" fill="#123">OpenClaw.Agent(推理编排)</text>
  <text x="370" y="765" font-size="12" text-anchor="middle" fill="#B5651D">Tools · Memory · Sessions · Skills · 消息流水线〔B·AI 会话引擎〕</text>

  <!-- 能力/插件层 -->
  <rect x="90" y="794" width="560" height="96" rx="8" fill="#E8F6EE" stroke="#E8862E" stroke-width="2"/>
  <text x="370" y="816" font-size="14" font-weight="bold" text-anchor="middle" fill="#123">能力 / 插件层</text>
  <text x="370" y="837" font-size="12" text-anchor="middle" fill="#B5651D">PluginKit · SkillKit〔B·工具/MCP〕</text>
  <text x="370" y="857" font-size="12" text-anchor="middle" fill="#B5651D">EmploymentCoachWorkflow〔B·就业领域〕· digital-employee 技能</text>
  <text x="370" y="878" font-size="12" text-anchor="middle" fill="#333">Payments · Channels(Telegram/Twilio/WhatsApp)· TokenCollector · Sandbox</text>

  <!-- Kingcrab.ServiceDefaults 冗余A -->
  <rect x="90" y="906" width="560" height="56" rx="8" fill="#FDECEC" stroke="#D64545" stroke-width="2.5"/>
  <text x="370" y="929" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#B02A2A">Kingcrab.ServiceDefaults　〔冗余 A〕</text>
  <text x="370" y="950" font-size="12" text-anchor="middle" fill="#555">OpenTelemetry(+Langfuse)· 健康检查 · 服务发现 · HTTP 弹性(与 hirebot 雷同)</text>

  <!-- LLM -->
  <rect x="90" y="1082" width="560" height="46" rx="8" fill="#EDEDED" stroke="#666" stroke-width="1.5"/>
  <text x="370" y="1110" font-size="13.5" text-anchor="middle" fill="#222">LLM Provider(大模型服务)</text>

  <!-- 主纵向调用箭头 -->
  <line x1="370" y1="138" x2="370" y2="194" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="294" x2="370" y2="306" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="352" x2="370" y2="362" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="586" x2="370" y2="642" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="704" x2="370" y2="718" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="778" x2="370" y2="792" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 跨服务 HTTP 调用(hirebot ApiService -> kingcrab Gateway) -->
  <polyline points="650,245 745,245 745,674 652,674" fill="none" stroke="#8A4FBF" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowHttp)"/>
  <text x="760" y="455" font-size="12" fill="#6A2F9F" transform="rotate(90 760 455)">HTTP 调用 kingcrab</text>

  <!-- Agent -> LLM 调用大模型 -->
  <polyline points="650,749 682,749 682,1105 652,1105" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="695" y="930" font-size="12" fill="#555" transform="rotate(90 695 930)">调用大模型</text>

  <!-- ============ 右侧图例 ============ -->
  <rect x="800" y="158" width="352" height="470" rx="10" fill="#FCFCFC" stroke="#999" stroke-width="1.2"/>
  <text x="820" y="184" font-size="15" font-weight="bold" fill="#222">冗余图例与结论</text>

  <!-- A -->
  <rect x="818" y="200" width="16" height="16" rx="3" fill="#FDECEC" stroke="#D64545" stroke-width="2"/>
  <text x="842" y="213" font-size="13" font-weight="bold" fill="#B02A2A">冗余 A｜基础设施层(确定冗余)</text>
  <text x="820" y="234" font-size="11.5" fill="#444">建议:立即抽成共享 NuGet 包。</text>
  <text x="820" y="252" font-size="11.5" fill="#444">· ServiceDefaults / OpenTelemetry /</text>
  <text x="820" y="269" font-size="11.5" fill="#444">　健康检查 / 服务发现 / HTTP 弹性——两份雷同</text>

  <!-- B -->
  <rect x="818" y="290" width="16" height="16" rx="3" fill="#FBEEDD" stroke="#E8862E" stroke-width="2"/>
  <text x="842" y="303" font-size="13" font-weight="bold" fill="#B5651D">冗余 B｜业务层(疑似,先厘清边界)</text>
  <text x="820" y="324" font-size="11.5" fill="#444">· 数字员工/就业:招聘模块 ↔</text>
  <text x="820" y="341" font-size="11.5" fill="#444">　EmploymentCoachWorkflow + digital-employee</text>
  <text x="820" y="362" font-size="11.5" fill="#444">· AI 会话:ConversationKickoffPrompt ↔</text>
  <text x="820" y="379" font-size="11.5" fill="#444">　Gateway / Agent 会话引擎</text>
  <text x="820" y="400" font-size="11.5" fill="#444">· 工具/MCP:HiringTodoMcpTools ↔</text>
  <text x="820" y="417" font-size="11.5" fill="#444">　PluginKit / SkillKit</text>
  <text x="820" y="438" font-size="11.5" fill="#444">· 认证:HireBot.Authentication ↔</text>
  <text x="820" y="455" font-size="11.5" fill="#444">　Gateway Auth + Keycloak</text>

  <!-- C -->
  <rect x="818" y="478" width="16" height="16" rx="3" fill="#E8F6EE" stroke="#2E9E5B" stroke-width="2"/>
  <text x="842" y="491" font-size="13" font-weight="bold" fill="#2E7D46">C｜勿动(合理的独立边界)</text>
  <text x="820" y="512" font-size="11.5" fill="#444">· 两套 .NET Aspire AppHost 是各自独立</text>
  <text x="820" y="529" font-size="11.5" fill="#444">　部署的编排入口,不要强行合并。</text>

  <!-- 优先级 -->
  <line x1="818" y1="548" x2="1134" y2="548" stroke="#DDD" stroke-width="1"/>
  <text x="820" y="570" font-size="12.5" font-weight="bold" fill="#333">去重优先级</text>
  <text x="820" y="590" font-size="11.5" fill="#2E7D46">① 立即做(收益最高):A 区共享包</text>
  <text x="820" y="608" font-size="11.5" fill="#B5651D">② 对齐边界后再动:B 区</text>
  <text x="820" y="626" font-size="11.5" fill="#B02A2A">③ 不要动:C 区(两套 AppHost)</text>
</svg>
