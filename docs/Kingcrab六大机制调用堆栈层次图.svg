<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="planningGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b7"/>
      <stop offset="100%" style="stop-color:#d4a574"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e6cf"/>
      <stop offset="100%" style="stop-color:#56ab91"/>
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#88d8f5"/>
      <stop offset="100%" style="stop-color:#5ba4cf"/>
    </linearGradient>
    <linearGradient id="stateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd3a5"/>
      <stop offset="100%" style="stop-color:#fd9853"/>
    </linearGradient>
    <linearGradient id="workflowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e2a9f5"/>
      <stop offset="100%" style="stop-color:#b44cd9"/>
    </linearGradient>
    <linearGradient id="multistepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e"/>
      <stop offset="100%" style="stop-color:#d45d79"/>
    </linearGradient>
    <linearGradient id="mafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5"/>
      <stop offset="100%" style="stop-color:#d0d0d0"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <rect x="50" y="20" width="1100" height="55" rx="8" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="600" y="55" text-anchor="middle" fill="white" font-size="22" font-weight="bold">Kingcrab 六大关键机制调用堆栈层次图</text>

  <!-- 图例 -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="1100" height="40" rx="6" fill="#f8f9fa" stroke="#e0e0e0"/>
    <rect x="20" y="10" width="16" height="16" rx="3" fill="url(#planningGrad)"/><text x="45" y="23" font-size="12">规划 Planning（偏弱）</text>
    <rect x="200" y="10" width="16" height="16" rx="3" fill="url(#toolGrad)"/><text x="225" y="23" font-size="12">工具调用 Tool Calling（强）</text>
    <rect x="380" y="10" width="16" height="16" rx="3" fill="url(#memoryGrad)"/><text x="405" y="23" font-size="12">记忆 Memory（中上）</text>
    <rect x="540" y="10" width="16" height="16" rx="3" fill="url(#stateGrad)"/><text x="565" y="23" font-size="12">状态管理 State（强）</text>
    <rect x="700" y="10" width="16" height="16" rx="3" fill="url(#workflowGrad)"/><text x="725" y="23" font-size="12">工作流 Workflow（中）</text>
    <rect x="870" y="10" width="16" height="16" rx="3" fill="url(#multistepGrad)"/><text x="895" y="23" font-size="12">多步执行 Multi-step（强）</text>
    <rect x="1020" y="10" width="16" height="16" rx="3" fill="url(#mafGrad)"/><text x="1045" y="23" font-size="12">MAF（黑盒）</text>
  </g>

  <!-- ==================== 第1层：外部渠道 ==================== -->
  <g transform="translate(0, 145)">
    <rect x="50" y="0" width="1100" height="50" rx="6" fill="#e9ecef" stroke="#ced4da" stroke-width="1.5"/>
    <text x="600" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">第1层：外部渠道 / 用户入口（OpenClaw.Channels / Gateway）</text>
    <g transform="translate(80, 10)">
      <rect x="0" y="0" width="100" height="30" rx="4" fill="white" stroke="#adb5bd"/><text x="50" y="20" text-anchor="middle" font-size="10">WebSocket</text>
      <rect x="120" y="0" width="100" height="30" rx="4" fill="white" stroke="#adb5bd"/><text x="170" y="20" text-anchor="middle" font-size="10">HTTP REST</text>
      <rect x="240" y="0" width="100" height="30" rx="4" fill="white" stroke="#adb5bd"/><text x="290" y="20" text-anchor="middle" font-size="10">飞书</text>
      <rect x="360" y="0" width="100" height="30" rx="4" fill="white" stroke="#adb5bd"/><text x="410" y="20" text-anchor="middle" font-size="10">钉钉</text>
      <rect x="480" y="0" width="100" height="30" rx="4" fill="white" stroke="#adb5bd"/><text x="530" y="20" text-anchor="middle" font-size="10">企微</text>
      <rect x="600" y="0" width="100" height="30" rx="4" fill="white" stroke="#adb5bd"/><text x="650" y="20" text-anchor="middle" font-size="10">OpenAI兼容</text>
      <rect x="720" y="0" width="100" height="30" rx="4" fill="white" stroke="#adb5bd"/><text x="770" y="20" text-anchor="middle" font-size="10">A2A协议</text>
      <rect x="840" y="0" width="100" height="30" rx="4" fill="white" stroke="#adb5bd"/><text x="890" y="20" text-anchor="middle" font-size="10">其他渠道</text>
    </g>
  </g>

  <!-- 箭头：渠道 → 网关 -->
  <line x1="600" y1="195" x2="600" y2="215" stroke="#666" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <text x="620" y="208" font-size="9" fill="#666">用户消息</text>

  <!-- ==================== 第2层：网关管道 ==================== -->
  <g transform="translate(0, 220)">
    <rect x="50" y="0" width="1100" height="70" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
    <text x="600" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">第2层：网关管道（ChatCommandProcessor / MessagePipeline）</text>
    <g transform="translate(100, 35)">
      <rect x="0" y="0" width="160" height="28" rx="4" fill="white" stroke="#ffc107"/><text x="80" y="18" text-anchor="middle" font-size="10">ChatCommandProcessor</text>
      <rect x="180" y="0" width="160" height="28" rx="4" fill="white" stroke="#ffc107"/><text x="260" y="18" text-anchor="middle" font-size="10">SessionManager</text>
      <rect x="360" y="0" width="160" height="28" rx="4" fill="white" stroke="#ffc107"/><text x="440" y="18" text-anchor="middle" font-size="10">MessagePipeline</text>
      <rect x="540" y="0" width="160" height="28" rx="4" fill="white" stroke="#ffc107"/><text x="620" y="18" text-anchor="middle" font-size="10">BoundedChannel (1024)</text>
      <rect x="720" y="0" width="160" height="28" rx="4" fill="white" stroke="#ffc107"/><text x="800" y="18" text-anchor="middle" font-size="10">SessionBranch</text>
    </g>
  </g>

  <!-- 箭头：网关 → MAF Runtime -->
  <line x1="600" y1="290" x2="600" y2="315" stroke="#666" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <text x="620" y="306" font-size="9" fill="#666">RunAsync / RunStreamingAsync</text>

  <!-- ==================== 第3层：MAF Runtime（核心编排）==================== -->
  <g transform="translate(0, 320)">
    <rect x="50" y="0" width="1100" height="90" rx="6" fill="url(#multistepGrad)" stroke="#d45d79" stroke-width="2"/>
    <text x="600" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="white">第3层：MafAgentRuntime（多步任务执行核心 — 最强机制之一）</text>

    <!-- 内部子模块 -->
    <g transform="translate(80, 35)">
      <rect x="0" y="0" width="130" height="48" rx="4" fill="white" fill-opacity="0.95"/><text x="65" y="18" text-anchor="middle" font-size="9" font-weight="bold">MafAgentFactory</text><text x="65" y="32" text-anchor="middle" font-size="8">每次RunAsync新建</text><text x="65" y="43" text-anchor="middle" font-size="8">ChatClientAgent</text>
      <rect x="145" y="0" width="130" height="48" rx="4" fill="white" fill-opacity="0.95"/><text x="210" y="18" text-anchor="middle" font-size="9" font-weight="bold">MafSessionStateStore</text><text x="210" y="32" text-anchor="middle" font-size="8">SHA-256路径+</text><text x="210" y="43" text-anchor="middle" font-size="8">三重校验Envelope</text>
      <rect x="290" y="0" width="130" height="48" rx="4" fill="white" fill-opacity="0.95"/><text x="355" y="18" text-anchor="middle" font-size="9" font-weight="bold">ContextBudgetPlanner</text><text x="355" y="32" text-anchor="middle" font-size="8">Token预算+</text><text x="355" y="43" text-anchor="middle" font-size="8">不可信标签注入</text>
      <rect x="435" y="0" width="130" height="48" rx="4" fill="white" fill-opacity="0.95"/><text x="500" y="18" text-anchor="middle" font-size="9" font-weight="bold">CompactHistoryAsync</text><text x="500" y="32" text-anchor="middle" font-size="8">>30轮→LLM摘要</text><text x="500" y="43" text-anchor="middle" font-size="8">失败→截断降级</text>
      <rect x="580" y="0" width="130" height="48" rx="4" fill="white" fill-opacity="0.95"/><text x="645" y="18" text-anchor="middle" font-size="9" font-weight="bold">LearningService</text><text x="645" y="32" text-anchor="middle" font-size="8">重复序列→</text><text x="645" y="43" text-anchor="middle" font-size="8">起草Skill→审批</text>
      <rect x="725" y="0" width="130" height="48" rx="4" fill="white" fill-opacity="0.95"/><text x="790" y="18" text-anchor="middle" font-size="9" font-weight="bold">RuntimePulseService</text><text x="790" y="32" text-anchor="middle" font-size="8">HEARTBEAT.md</text><text x="790" y="43" text-anchor="middle" font-size="8">驱动LLM自查</text>
    </g>
  </g>

  <!-- 箭头：Runtime → MAF黑盒 -->
  <line x1="600" y1="410" x2="600" y2="435" stroke="#666" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <text x="620" y="426" font-size="9" fill="#666">agent.RunAsync()</text>

  <!-- ==================== 第4层：MAF 黑盒 ==================== -->
  <g transform="translate(0, 440)">
    <rect x="50" y="0" width="1100" height="70" rx="6" fill="url(#mafGrad)" stroke="#a0a0a0" stroke-width="2"/>
    <text x="600" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">第4层：Microsoft Agent Framework（MAF）— 黑盒循环</text>
    <g transform="translate(120, 35)">
      <rect x="0" y="0" width="150" height="28" rx="4" fill="white" stroke="#a0a0a0"/><text x="75" y="18" text-anchor="middle" font-size="10">ChatClientAgent</text>
      <rect x="170" y="0" width="180" height="28" rx="4" fill="white" stroke="#a0a0a0"/><text x="260" y="18" text-anchor="middle" font-size="10">FunctionInvokingChatClient</text>
      <rect x="370" y="0" width="150" height="28" rx="4" fill="white" stroke="#a0a0a0"/><text x="445" y="18" text-anchor="middle" font-size="10">IChatClient (LLM调用)</text>
      <rect x="540" y="0" width="150" height="28" rx="4" fill="white" stroke="#a0a0a0"/><text x="615" y="18" text-anchor="middle" font-size="10">AIFunction</text>
      <rect x="710" y="0" width="150" height="28" rx="4" fill="white" stroke="#a0a0a0"/><text x="785" y="18" text-anchor="middle" font-size="10">A2A 协议端点</text>
    </g>
  </g>

  <!-- 箭头：MAF → 工具层 -->
  <line x1="600" y1="510" x2="600" y2="535" stroke="#666" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <text x="620" y="526" font-size="9" fill="#666">AIFunction.Invoke()</text>

  <!-- ==================== 第5层：工具调用（Tool Calling — 最强机制）==================== -->
  <g transform="translate(0, 540)">
    <rect x="50" y="0" width="1100" height="100" rx="6" fill="url(#toolGrad)" stroke="#3d8b6e" stroke-width="2"/>
    <text x="600" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="white">第5层：工具调用（Tool Calling — 最强机制）</text>

    <!-- 三层注册 -->
    <g transform="translate(80, 35)">
      <rect x="0" y="0" width="100" height="28" rx="4" fill="white" fill-opacity="0.95"/><text x="50" y="18" text-anchor="middle" font-size="9" font-weight="bold">①原生动态插件</text>
      <line x1="100" y1="14" x2="130" y2="14" stroke="#fff" stroke-width="1" stroke-dasharray="3,2"/>
      <rect x="130" y="0" width="100" height="28" rx="4" fill="white" fill-opacity="0.95"/><text x="180" y="18" text-anchor="middle" font-size="9" font-weight="bold">②C#内置工具</text>
      <line x1="230" y1="14" x2="260" y2="14" stroke="#fff" stroke-width="1" stroke-dasharray="3,2"/>
      <rect x="260" y="0" width="100" height="28" rx="4" fill="white" fill-opacity="0.95"/><text x="310" y="18" text-anchor="middle" font-size="9" font-weight="bold">③MCP工具</text>

      <!-- OpenClawToolExecutor 大管家 -->
      <rect x="450" y="-15" width="220" height="58" rx="5" fill="white" fill-opacity="0.98" stroke="#3d8b6e" stroke-width="2"/>
      <text x="560" y="3" text-anchor="middle" font-size="10" font-weight="bold">OpenClawToolExecutor</text>
      <text x="560" y="17" text-anchor="middle" font-size="8" fill="#555">（统一执行器，七类横切关注点）</text>
      <text x="560" y="32" text-anchor="middle" font-size="8">①Preset过滤 → ②Hook检查 → ③PEV判断</text>
      <text x="560" y="43" text-anchor="middle" font-size="8">④审批回调 → ⑤沙箱执行 → ⑥审计+脱敏</text>

      <!-- Hooks -->
      <rect x="690" y="-15" width="140" height="58" rx="5" fill="white" fill-opacity="0.95"/>
      <text x="760" y="3" text-anchor="middle" font-size="9" font-weight="bold">七大Hook</text>
      <text x="760" y="17" text-anchor="middle" font-size="8">ContractScopeHook</text>
      <text x="760" y="29" text-anchor="middle" font-size="8">ToolApprovalCallback</text>
      <text x="760" y="41" text-anchor="middle" font-size="8">AuditLogHook</text>
      <text x="760" y="53" text-anchor="middle" font-size="8">Sentinel/Redaction</text>

      <!-- 最终工具 -->
      <rect x="850" y="-5" width="100" height="38" rx="5" fill="white" fill-opacity="0.9"/>
      <text x="900" y="12" text-anchor="middle" font-size="9" font-weight="bold">ITool</text>
      <text x="900" y="26" text-anchor="middle" font-size="8">实现类</text>
    </g>
  </g>

  <!-- 箭头：工具 → PEV/治理 -->
  <line x1="600" y1="640" x2="600" y2="665" stroke="#666" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <text x="620" y="656" font-size="9" fill="#666">高风险→立约审批</text>

  <!-- ==================== 第6层：规划/治理/记忆/状态 ==================== -->
  <g transform="translate(0, 670)">
    <rect x="50" y="0" width="1100" height="110" rx="6" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="600" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">横切支撑层：规划 / 治理 / 记忆 / 状态</text>

    <!-- 规划 -->
    <g transform="translate(80, 30)">
      <rect x="0" y="0" width="130" height="70" rx="5" fill="url(#planningGrad)" stroke="#c49660" stroke-width="1.5"/>
      <text x="65" y="18" text-anchor="middle" font-size="10" font-weight="bold">规划 Planning</text>
      <text x="65" y="33" text-anchor="middle" font-size="8">IPlanExecuteVerify</text>
      <text x="65" y="44" text-anchor="middle" font-size="8">Orchestrator</text>
      <text x="65" y="57" text-anchor="middle" font-size="7">MAF Durable HTTP</text>
      <text x="65" y="67" text-anchor="middle" font-size="7">SkillWorkflowStepType</text>
    </g>

    <!-- 记忆 -->
    <g transform="translate(230, 30)">
      <rect x="0" y="0" width="130" height="70" rx="5" fill="url(#memoryGrad)" stroke="#4a8db5" stroke-width="1.5"/>
      <text x="65" y="18" text-anchor="middle" font-size="10" font-weight="bold">记忆 Memory</text>
      <text x="65" y="33" text-anchor="middle" font-size="8">IMemoryStore (6接口)</text>
      <text x="65" y="44" text-anchor="middle" font-size="8">File/SQLite/Mempalace</text>
      <text x="65" y="57" text-anchor="middle" font-size="7">ContextBudgetPlanner</text>
      <text x="65" y="67" text-anchor="middle" font-size="7">不可信标签+防注入</text>
    </g>

    <!-- 状态管理 -->
    <g transform="translate(380, 30)">
      <rect x="0" y="0" width="130" height="70" rx="5" fill="url(#stateGrad)" stroke="#e07b30" stroke-width="1.5"/>
      <text x="65" y="18" text-anchor="middle" font-size="10" font-weight="bold">状态 State</text>
      <text x="65" y="33" text-anchor="middle" font-size="8">ConcurrentDictionary</text>
      <text x="65" y="44" text-anchor="middle" font-size="8">IMemoryStore持久化</text>
      <text x="65" y="57" text-anchor="middle" font-size="7">ISharedHarness</text>
      <text x="65" y="67" text-anchor="middle" font-size="7">StateStore (跨实例)</text>
    </g>

    <!-- 工作流 -->
    <g transform="translate(530, 30)">
      <rect x="0" y="0" width="130" height="70" rx="5" fill="url(#workflowGrad)" stroke="#9a3dbf" stroke-width="1.5"/>
      <text x="65" y="18" text-anchor="middle" font-size="10" font-weight="bold">工作流 Workflow</text>
      <text x="65" y="33" text-anchor="middle" font-size="8">IAgentWorkflowRunner</text>
      <text x="65" y="44" text-anchor="middle" font-size="8">MafDurableHttp</text>
      <text x="65" y="57" text-anchor="middle" font-size="7">Handoff todo</text>
      <text x="65" y="67" text-anchor="middle" font-size="7">状态机 (7状态)</text>
    </g>

    <!-- PEV治理台 -->
    <g transform="translate(680, 30)">
      <rect x="0" y="0" width="180" height="70" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="bold">PEV 治理台（5验证器）</text>
      <text x="90" y="33" text-anchor="middle" font-size="8">ToolOutcomeVerifier</text>
      <text x="90" y="44" text-anchor="middle" font-size="8">ApprovalVerifier / ContractCompleteness</text>
      <text x="90" y="55" text-anchor="middle" font-size="8">SecurityPosture / Regression</text>
      <text x="90" y="67" text-anchor="middle" font-size="8">失败→Rollback / Escalate</text>
    </g>

    <!-- 存储后端 -->
    <g transform="translate(880, 30)">
      <rect x="0" y="0" width="130" height="70" rx="5" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5"/>
      <text x="65" y="18" text-anchor="middle" font-size="10" font-weight="bold">存储后端</text>
      <text x="65" y="33" text-anchor="middle" font-size="8">FileMemoryStore</text>
      <text x="65" y="44" text-anchor="middle" font-size="8">SqliteMemoryStore</text>
      <text x="65" y="55" text-anchor="middle" font-size="8">MempalaceMemory</text>
      <text x="65" y="67" text-anchor="middle" font-size="8">（均为本地）</text>
    </g>
  </g>

  <!-- ==================== 底部：核心哲学 ==================== -->
  <g transform="translate(0, 795)">
    <rect x="50" y="0" width="1100" height="45" rx="6" fill="#1a1a2e"/>
    <text x="600" y="20" text-anchor="middle" fill="#ffd700" font-size="13" font-weight="bold">核心设计哲学：重治理、轻规划、循环外包、能力外挂</text>
    <text x="600" y="36" text-anchor="middle" fill="#adb5bd" font-size="10">Microsoft Agent Framework（MAF）是黑盒跑步机，Kingcrab 在外面套外骨骼（治理/审计/防护），不让它跑偏</text>
  </g>

  <!-- 侧边标注：MAF外部 Durable调用 -->
  <g transform="translate(1000, 440)">
    <rect x="0" y="0" width="140" height="55" rx="5" fill="#f0f0f0" stroke="#999" stroke-dasharray="3,2"/>
    <text x="70" y="18" text-anchor="middle" font-size="9" font-weight="bold">远程 Durable</text>
    <text x="70" y="32" text-anchor="middle" font-size="8">MAF Durable Functions</text>
    <text x="70" y="44" text-anchor="middle" font-size="8">（外部服务，长跑任务）</text>
  </g>
  <line x1="1000" y1="467" x2="1150" y2="467" stroke="#999" stroke-dasharray="3,2"/>
  <line x1="1150" y1="467" x2="1150" y2="490" stroke="#999" stroke-dasharray="3,2"/>
  <line x1="1150" y1="490" x2="950" y2="490" stroke="#999" stroke-dasharray="3,2" marker-end="url(#arrowHead)"/>

</svg>
