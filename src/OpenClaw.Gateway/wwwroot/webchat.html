<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Crab WebChat</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Highlight.js for Code Blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <link rel="stylesheet" href="webchat.css">
</head>

<body>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div id="header">
        <div class="header-brand">
            <img src="image.png" alt="King Crab Logo">
            <h2>King Crab</h2>
        </div>
        <div class="header-right">
            <!-- Connection status -->
            <div id="conn-status" class="disconnected">
                <span id="conn-dot"></span>
                <span id="conn-label">Disconnected</span>
            </div>

            <!-- Doctor diagnostics -->
            <button id="doctor-button" class="nav-btn" title="Fetch /doctor/text">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                Diagnostics
            </button>

            <!-- OIDC login (shown when OIDC configured and not logged in) -->
            <button id="oidc-login-button" class="nav-btn teal" title="Sign in with OIDC" style="display:none">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                Sign In
            </button>

            <!-- OIDC logout (shown when OIDC logged in) -->
            <button id="oidc-logout-button" class="nav-btn danger" title="Sign out from OIDC" style="display:none">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign Out
            </button>

            <!-- Token panel (shown when OIDC not available) -->
            <div id="token-panel">
                <button id="token-panel-toggle" class="nav-btn" title="Set auth token">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <span id="token-panel-label">Token</span>
                </button>
                <div id="token-dropdown">
                    <label for="token-input">Auth Token</label>
                    <input type="password" id="token-input" placeholder="Paste token here…" autocomplete="off">
                    <div id="token-dropdown-actions">
                        <label id="remember-token-wrap" title="Persist token in this browser">
                            <input type="checkbox" id="remember-token">
                            Remember me
                        </label>
                        <button id="token-apply-btn" class="nav-btn primary">Connect</button>
                    </div>
                </div>
            </div>

            <!-- Logged-in user chip -->
            <div id="user-chip">
                <div id="user-avatar-mini">U</div>
                <span id="user-display-name">User</span>
            </div>

            <!-- Sidebar toggle -->
            <button id="sidebar-toggle" class="nav-btn" title="Toggle session history" style="padding:0.5rem 0.6rem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>

            <!-- Channel Config button -->
            <button id="channel-panel-btn" class="nav-btn" title="渠道配置">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
                渠道
            </button>

            <!-- MCP Servers button -->
            <button id="mcp-panel-btn" class="nav-btn" title="Manage workspace MCP servers">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                MCP
            </button>
        </div>
    </div>

    <!-- Channel Config Modal -->
    <div id="channel-overlay" class="mcp-overlay" role="dialog" aria-modal="true" aria-label="渠道配置">
        <div class="mcp-panel">
            <div class="mcp-panel-header">
                <div class="mcp-panel-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
                    渠道配置
                </div>
                <button id="channel-close-btn" class="mcp-close-btn" title="关闭" aria-label="关闭渠道配置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <div class="mcp-panel-body">
                <!-- Channel tabs -->
                <div class="ch-tabs">
                    <button class="ch-tab active" data-channel="feishu">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        飞书 (Feishu)
                    </button>
                </div>

                <!-- Feishu form -->
                <div id="ch-feishu-form" class="mcp-form-grid">
                    <label class="mcp-label">App ID</label>
                    <input id="feishu-appid" class="mcp-input" type="text" placeholder="cli_xxxxxxxxxxxxxxxx" autocomplete="off">

                    <label class="mcp-label">App Secret <span class="mcp-hint">(留空保持不变)</span></label>
                    <input id="feishu-appsecret" class="mcp-input" type="password" placeholder="留空保持不变" autocomplete="new-password">
                </div>

                <div id="ch-form-error" class="mcp-form-error" style="display:none"></div>

                <div class="mcp-form-actions">
                    <button id="channel-load-btn" class="nav-btn" title="从服务器加载当前生效配置">↻ 加载</button>
                    <button id="channel-revert-btn" class="nav-btn danger" title="清除覆盖，恢复 appsettings 默认值">恢复默认</button>
                    <button id="channel-save-btn" class="nav-btn primary" title="保存配置并重新连接渠道">保存并重连</button>
                </div>
            </div>

            <div id="ch-panel-status" class="mcp-panel-status" style="display:none"></div>
        </div>
    </div>

    <!-- MCP Server Management Modal -->
    <div id="mcp-overlay" class="mcp-overlay" role="dialog" aria-modal="true" aria-label="MCP Servers">
        <div class="mcp-panel">
            <div class="mcp-panel-header">
                <div class="mcp-panel-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    MCP Servers
                </div>
                <button id="mcp-close-btn" class="mcp-close-btn" title="Close" aria-label="Close MCP panel">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <div class="mcp-panel-body">
                <!-- Server list -->
                <div id="mcp-server-list" class="mcp-server-list"></div>

                <!-- Add/Edit form -->
                <div id="mcp-form-section" class="mcp-form-section" style="display:none">
                    <div class="mcp-form-title" id="mcp-form-title">Add Server</div>
                    <div class="mcp-form-grid">
                        <label class="mcp-label">Server ID <span class="mcp-hint">(unique key)</span></label>
                        <input id="mcp-f-id" class="mcp-input" type="text" placeholder="my-server" autocomplete="off">

                        <label class="mcp-label">Display Name <span class="mcp-hint">(optional)</span></label>
                        <input id="mcp-f-name" class="mcp-input" type="text" placeholder="My MCP Server" autocomplete="off">

                        <label class="mcp-label">Transport</label>
                        <select id="mcp-f-transport" class="mcp-input">
                            <option value="streamable-http">streamable-http</option>
                            <option value="sse">sse</option>
                        </select>

                        <label class="mcp-label">URL</label>
                        <input id="mcp-f-url" class="mcp-input" type="url" placeholder="https://example.com/mcp" autocomplete="off">

                        <label class="mcp-label">Bearer Token <span class="mcp-hint">(Authorization header)</span></label>
                        <input id="mcp-f-token" class="mcp-input" type="password" placeholder="Leave blank if none" autocomplete="new-password">

                        <label class="mcp-label mcp-label-top">Extra Headers <span class="mcp-hint">(key / value)</span></label>
                        <div id="mcp-f-headers-wrap" class="mcp-headers-wrap">
                            <div id="mcp-f-headers-rows"></div>
                            <button type="button" id="mcp-f-add-header-btn" class="mcp-add-header-btn">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                Add Header
                            </button>
                        </div>

                        <label class="mcp-label">Tool Name Prefix <span class="mcp-hint">(optional)</span></label>
                        <input id="mcp-f-prefix" class="mcp-input" type="text" placeholder="e.g. myserver_" autocomplete="off">

                        <label class="mcp-label">Startup Timeout (s) <span class="mcp-hint">(default 10)</span></label>
                        <input id="mcp-f-startup-timeout" class="mcp-input" type="number" min="1" placeholder="10" autocomplete="off">

                        <label class="mcp-label">Request Timeout (s) <span class="mcp-hint">(default 60)</span></label>
                        <input id="mcp-f-request-timeout" class="mcp-input" type="number" min="1" placeholder="60" autocomplete="off">

                        <label class="mcp-label">Enabled</label>
                        <label class="mcp-toggle">
                            <input id="mcp-f-enabled" type="checkbox" checked>
                            <span class="mcp-toggle-track"></span>
                        </label>
                    </div>
                    <div id="mcp-form-error" class="mcp-form-error" style="display:none"></div>
                    <div class="mcp-form-actions">
                        <button id="mcp-form-cancel-btn" class="nav-btn">Cancel</button>
                        <button id="mcp-form-save-btn" class="nav-btn primary">Save</button>
                    </div>
                </div>

                <!-- Add button (shown when form is hidden) -->
                <button id="mcp-add-btn" class="mcp-add-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add Server
                </button>
            </div>

            <div id="mcp-panel-status" class="mcp-panel-status" style="display:none"></div>
        </div>
    </div>

    <div id="app-layout">
        <div id="sidebar">
            <div id="sidebar-header">
                <button id="new-chat-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                </button>
                <input id="session-search" type="text" placeholder="Search sessions…">
            </div>
            <div id="session-list">
                <div id="sidebar-empty">Loading sessions…</div>
            </div>
        </div>

        <div id="chat-area">
            <div id="history-banner">
                <span id="history-banner-text">Viewing session history (read-only)</span>
                <button id="back-to-live-btn">↩ Back to Live Chat</button>
            </div>

            <div id="chat-wrapper">
                <div id="chat-container">
                    <!-- Messages will render here -->
                    <div class="message-row typing-row" id="typing-row">
                        <div class="agent-avatar"><img src="image.png" alt="Agent" /></div>
                        <div class="typing-indicator">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="input-wrapper">
                <div id="image-preview-strip"></div>
                <div id="input-container">
                    <input type="file" id="file-input" accept="*/*" multiple style="display:none">
                    <button id="attach-btn" disabled title="Attach images or files">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <textarea id="message-input" rows="1" placeholder="Message King Crab..." disabled></textarea>
                    <button id="send-button" disabled title="Send Message">
                        <span class="icon-send">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </span>
                        <span class="icon-stop">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                <rect x="5" y="5" width="14" height="14" rx="2"/>
                            </svg>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts for Markdown parsing and Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <script src="oidc-auth.js"></script>

    <script src="webchat.js"></script>
</body>

</html>
