<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Crab WebChat</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Highlight.js for Code Blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <link rel="stylesheet" href="webchat.css">
</head>

<body>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div id="header">
        <div class="header-brand">
            <img src="image.png" alt="King Crab Logo">
            <h2>King Crab</h2>
        </div>
        <div class="header-right">
            <!-- Connection status -->
            <div id="conn-status" class="disconnected">
                <span id="conn-dot"></span>
                <span id="conn-label">Disconnected</span>
            </div>

            <!-- Doctor diagnostics -->
            <button id="doctor-button" class="nav-btn" title="Fetch /doctor/text">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                Diagnostics
            </button>

            <!-- OIDC login (shown when OIDC configured and not logged in) -->
            <button id="oidc-login-button" class="nav-btn teal" title="Sign in with OIDC" style="display:none">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                Sign In
            </button>

            <!-- OIDC logout (shown when OIDC logged in) -->
            <button id="oidc-logout-button" class="nav-btn danger" title="Sign out from OIDC" style="display:none">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign Out
            </button>

            <!-- Token panel (shown when OIDC not available) -->
            <div id="token-panel">
                <button id="token-panel-toggle" class="nav-btn" title="Set auth token">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <span id="token-panel-label">Token</span>
                </button>
                <div id="token-dropdown">
                    <label for="token-input">Auth Token</label>
                    <input type="password" id="token-input" placeholder="Paste token here…" autocomplete="off">
                    <div id="token-dropdown-actions">
                        <label id="remember-token-wrap" title="Persist token in this browser">
                            <input type="checkbox" id="remember-token">
                            Remember me
                        </label>
                        <button id="token-apply-btn" class="nav-btn primary">Connect</button>
                    </div>
                </div>
            </div>

            <!-- Logged-in user chip -->
            <div id="user-chip">
                <div id="user-avatar-mini">U</div>
                <span id="user-display-name">User</span>
            </div>

            <!-- Sidebar toggle -->
            <button id="sidebar-toggle" class="nav-btn" title="Toggle session history" style="padding:0.5rem 0.6rem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
    </div>

    <div id="app-layout">
        <div id="sidebar">
            <div id="sidebar-header">
                <button id="new-chat-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                </button>
                <input id="session-search" type="text" placeholder="Search sessions…">
            </div>
            <div id="session-list">
                <div id="sidebar-empty">Loading sessions…</div>
            </div>
        </div>

        <div id="chat-area">
            <div id="history-banner">
                <span id="history-banner-text">Viewing session history (read-only)</span>
                <button id="back-to-live-btn">↩ Back to Live Chat</button>
            </div>

            <div id="chat-wrapper">
                <div id="chat-container">
                    <!-- Messages will render here -->
                    <div class="message-row typing-row" id="typing-row">
                        <div class="agent-avatar"><img src="image.png" alt="Agent" /></div>
                        <div class="typing-indicator">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="input-wrapper">
                <div id="image-preview-strip"></div>
                <div id="input-container">
                    <input type="file" id="file-input" accept="*/*" multiple style="display:none">
                    <button id="attach-btn" disabled title="Attach images or files">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <textarea id="message-input" rows="1" placeholder="Message King Crab..." disabled></textarea>
                    <button id="send-button" disabled title="Send Message">
                        <span class="icon-send">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </span>
                        <span class="icon-stop">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                <rect x="5" y="5" width="14" height="14" rx="2"/>
                            </svg>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts for Markdown parsing and Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <script src="oidc-auth.js"></script>

    <script src="webchat.js"></script>
</body>

</html>
